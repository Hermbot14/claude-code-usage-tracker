<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy — the renderer loads only its own local bundle and
      talks to the main process over IPC (it makes no network requests of its
      own). Lock everything to 'self' so a hypothetical XSS cannot pull in remote
      script or exfiltrate over the network. 'unsafe-inline' is required for the
      synchronous theme preloader below and React/Tailwind's injected styles; no
      remote origin is ever permitted.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'"
    />
    <title>Usage Tracker</title>
    <!--
      Synchronous theme preloader — runs before React mounts, before CSS parses.
      Sets the correct dark class, data-theme, and background color on <html>
      immediately, so there is zero FOUC and no resize flash.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem('usage-tracker-dark')
        var dark =
          stored === 'true' ||
          (stored === null && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var theme = localStorage.getItem('usage-tracker-theme') || 'default'
        // 'vercel' was folded into the default when the default became Geist.
        if (theme === 'vercel') theme = 'default'

        if (dark) document.documentElement.classList.add('dark')
        if (theme && theme !== 'default')
          document.documentElement.setAttribute('data-theme', theme)

        // [light, dark] page background per theme. Must match
        // styles/themes.css and THEMES in lib/theme.ts.
        var BG = {
          default:    ['#fafafa', '#000000'],
          olive:      ['#f2f2ed', '#0b0b0f'],
          dusk:       ['#f5f5f0', '#131419'],
          lime:       ['#e8f5a3', '#0f0f1a'],
          ocean:      ['#e0f2fe', '#082f49'],
          retro:      ['#fef3c7', '#1c1917'],
          neo:        ['#fdf4ff', '#0f0720'],
          forest:     ['#dcfce7', '#052e16'],
          sportslink: ['#f4f7fb', '#071626'],
          blossom:    ['#fff7fb', '#14101c'],
        }
        var pair = BG[theme] || BG['default']
        document.documentElement.style.backgroundColor = dark ? pair[1] : pair[0]

        // Suppress transitions on the very first paint so the initial background
        // renders without a 300ms fade from the wrong colour.
        document.documentElement.classList.add('no-transition')
      })()
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
